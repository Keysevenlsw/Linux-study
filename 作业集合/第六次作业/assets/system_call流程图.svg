<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1820" viewBox="0 0 1500 1820">
<rect width="100%" height="100%" fill="white"/>
<text x="750" y="42.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#20334a">32位 x86 系统调用处理流程</text>
<text x="750" y="90.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#58677a">Linux 3.18.6 · write 系统调用 · int 0x80 入口</text>
<rect x="330.0" y="131.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">用户态：准备调用号和参数，执行 int $0x80</text>
<rect x="330.0" y="266.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="293.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">CPU 切换到内核栈</text>
<text x="650" y="327.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">保存 EIP、CS、EFLAGS、用户 ESP 和 SS</text>
<rect x="330.0" y="401.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="428.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">system_call：保存原调用号、SAVE_ALL</text>
<text x="650" y="462.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">准备内核环境并取得线程信息</text>
<polygon points="650,522 930,580 650,638 370,580" fill="#fff8e7" stroke="#235789" stroke-width="3"/>
<text x="650" y="580.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">需要入口工作处理？</text>
<rect x="1055.0" y="533.0" width="350" height="94" rx="14" fill="#f3f5f7" stroke="#7b8795" stroke-width="3"/>
<text x="1230" y="563.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#20334a">syscall_trace_entry</text>
<text x="1230" y="596.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#20334a">跟踪 / 审计等入口处理</text>
<polygon points="650,687 930,745 650,803 370,745" fill="#fff8e7" stroke="#235789" stroke-width="3"/>
<text x="650" y="745.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">系统调用号有效？</text>
<rect x="25.0" y="698.0" width="250" height="94" rx="14" fill="#f3f5f7" stroke="#7b8795" stroke-width="3"/>
<text x="150" y="728.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#20334a">无效调用号</text>
<text x="150" y="761.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#20334a">返回 -ENOSYS</text>
<rect x="330.0" y="856.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="883.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">syscall_call：调用 sys_call_table[eax]</text>
<text x="650" y="917.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">本次：SyS_write → 写入 → 返回14</text>
<rect x="330.0" y="996.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="1023.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">syscall_after_call</text>
<text x="650" y="1057.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">将返回值保存到现场的 EAX 槽位</text>
<polygon points="650,1142 930,1200 650,1258 370,1200" fill="#fff8e7" stroke="#235789" stroke-width="3"/>
<text x="650" y="1200.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">还有返回前工作？</text>
<rect x="1055.0" y="1137.0" width="350" height="126" rx="14" fill="#f3f5f7" stroke="#7b8795" stroke-width="3"/>
<text x="1230" y="1167.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#20334a">处理退出跟踪、调度、</text>
<text x="1230" y="1200.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#20334a">信号和通知等工作</text>
<text x="1230" y="1233.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#20334a">本次实际调用 schedule()</text>
<rect x="330.0" y="1356.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="1383.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">restore_all / restore_nocheck</text>
<text x="650" y="1417.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">恢复寄存器，跳过原调用号等槽位</text>
<rect x="330.0" y="1496.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="1523.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">irq_return：执行 iret</text>
<text x="650" y="1557.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">恢复用户执行位置、标志及用户栈</text>
<rect x="330.0" y="1636.0" width="640" height="88" rx="14" fill="#eef5fc" stroke="#235789" stroke-width="3"/>
<text x="650" y="1663.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">用户态：从 int $0x80 后继续执行</text>
<text x="650" y="1697.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#20334a">本次 EAX=14，返回 EIP=0x0804a04d</text>
<polyline points="650,219 650,266" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,266 644,254 656,254" fill="#235789"/>
<polyline points="650,354 650,401" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,401 644,389 656,389" fill="#235789"/>
<polyline points="650,489 650,522" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,522 644,510 656,510" fill="#235789"/>
