<polygon points="650,687 644,675 656,675" fill="#235789"/>
<polyline points="650,803 650,856" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,856 644,844 656,844" fill="#235789"/>
<polyline points="650,944 650,996" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,996 644,984 656,984" fill="#235789"/>
<polyline points="650,1084 650,1142" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,1142 644,1130 656,1130" fill="#235789"/>
<polyline points="650,1258 650,1356" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,1356 644,1344 656,1344" fill="#235789"/>
<polyline points="650,1444 650,1496" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,1496 644,1484 656,1484" fill="#235789"/>
<polyline points="650,1584 650,1636" fill="none" stroke="#235789" stroke-width="3"/>
<polygon points="650,1636 644,1624 656,1624" fill="#235789"/>
<text x="610" y="658.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#20334a">否</text>
<text x="610" y="825.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#20334a">是</text>
<text x="610" y="1300.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#20334a">否</text>
<polyline points="930,580 1055,580" fill="none" stroke="#7b8795" stroke-width="3"/>
<polygon points="1055,580 1043,574 1043,586" fill="#7b8795"/>
<text x="990" y="550.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#20334a">是</text>
<polyline points="1230,627 1230,665 650,665 650,687" fill="none" stroke="#7b8795" stroke-width="3"/>
<polygon points="650,687 644,675 656,675" fill="#7b8795"/>
<polyline points="370,745 275,745" fill="none" stroke="#7b8795" stroke-width="3"/>
<polygon points="275,745 287,739 287,751" fill="#7b8795"/>
<text x="320" y="715.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#20334a">否</text>
<polyline points="150,792 150,1040 330,1040" fill="none" stroke="#7b8795" stroke-width="3"/>
<polygon points="330,1040 318,1034 318,1046" fill="#7b8795"/>
<polyline points="930,1200 1055,1200" fill="none" stroke="#7b8795" stroke-width="3"/>
<polygon points="1055,1200 1043,1194 1043,1206" fill="#7b8795"/>
<text x="990" y="1170.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#20334a">是</text>
<polyline points="1230,1263 1230,1320 1020,1320 1020,1110 650,1110 650,1142" fill="none" stroke="#7b8795" stroke-width="3"/>
<polygon points="650,1142 644,1130 656,1130" fill="#7b8795"/>
<text x="1200" y="1352.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#58677a">处理后重新检查</text>
<text x="750" y="1770.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#58677a">灰色框为条件处理；本次进入重新调度分支。省略特殊段栈和异常修复细节。</text>
</svg>